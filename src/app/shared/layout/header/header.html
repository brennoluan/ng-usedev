<header>
  <div class="container">
    <a routerLink="/products">
      <img src="images/logo.svg" alt="Logo UseDev" />
    </a>
    <div class="actions">
      @if (authService.isLogged()) {
        <div class="action" (click)="authService.logout()">Logout</div>
        <div class="cart">
          <a routerLink="/cart">
            <img src="images/shopping_cart.svg" alt="Ícone do carrinho de compras" />
          </a>
          @if (cartItemsCount() > 0) {
            <span class="badge">{{ cartItemsCount() }}</span>
          }
        </div>
      } @else {
        <div class="action" (click)="authService.login()">Login</div>
      }
    </div>
  </div>
</header>
