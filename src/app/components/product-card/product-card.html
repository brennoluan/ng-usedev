<div class="product-card">
  <img [src]="product().imageUrl" alt="Foto do produto {{ product().name }}" />
  <div class="product-info">
    <div class="product-name" (click)="addToCart.emit(product())">{{ product().name }}</div>
    <div class="product-price">R$ {{ product().price }}</div>
  </div>
</div>
