<header>
  <div class="container">
    <img src="images/logo.svg" alt="Logo UseDev" />
    <div class="cart">
      <img src="images/shopping_cart.svg" alt="Ícone do carrinho de compras" />
      <span class="badge">{{ totalCartItems() }}</span>
    </div>
  </div>
</header>
<img src="images/banner.png" class="banner" alt="Imagem banner" />
<main>
  <div class="container">
    <h2>Promos especiais</h2>
    <div class="product-list" (click)="addToCart()">
      @for (product of products(); track product.id) {
        <div class="product-card">
          <img [src]="product.imageUrl" alt="Foto do produto {{ product.name }}" />
          <div class="product-info">
            <div class="product-name">{{ product.name }}</div>
            <div class="product-price">R$ {{ product.price }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</main>
<footer>
  <div class="container">
    <img src="images/logo-green.svg" alt="Logo UseDev Verde" />
    <div class="slogan">Hora de abraçar seu lado geek!</div>
  </div>
</footer>
